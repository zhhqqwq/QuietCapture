name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            foreach ($error in $errors) {
              Write-Error "$($_.FullName):$($error.Extent.StartLineNumber): $($error.Message)"
              $failed = $true
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Restore
        run: dotnet restore QuietCapture.sln -p:Platform=x64
      - name: Build
        run: dotnet build QuietCapture.sln --configuration Release -p:Platform=x64 --no-restore
      - name: Test
        run: dotnet test QuietCapture.sln --configuration Release -p:Platform=x64 --no-build
